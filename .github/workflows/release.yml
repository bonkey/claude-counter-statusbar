name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # mise resolves versions from GitHub releases, so a push to main ships only once
  # the release for the version in pyproject.toml exists.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init_version=$(python3 -c "import claude_counter; print(claude_counter.__version__)")
          tag="v$version"
          if [ "$version" != "$init_version" ]; then
            echo "::error::pyproject.toml has $version but __version__ is $init_version."
            exit 1
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            # BEFORE is all zeros for a new branch and may be unreachable after a force push.
            if ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
              echo "::warning::Cannot read $BEFORE, so claude_counter/ was not checked for a missing bump."
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- claude_counter; then
              echo "::error::claude_counter/ changed, but $tag is already released. Bump the version."
              exit 1
            fi
            echo "::warning::$tag is already released. Nothing to release."
            exit 0
          fi

          latest=$(gh release list --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "::error::$tag is not newer than the latest release $latest."
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::notice::Tag $tag exists without a release. Releasing the existing tag."
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
